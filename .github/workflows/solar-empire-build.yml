name: Build Solar Empire

on:
  push:
    branches:
      - claude/solar-empire-idle-game-akn240
    paths:
      - "SolarEmpire/**"
      - ".github/workflows/solar-empire-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build for iPhone simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project SolarEmpire/SolarEmpire.xcodeproj \
            -scheme SolarEmpire \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -y SolarEmpire-Simulator.zip SolarEmpire.app

      - name: Upload app for browser testing (appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SolarEmpire-Simulator
          path: build/Build/Products/Debug-iphonesimulator/SolarEmpire-Simulator.zip
          retention-days: 30
