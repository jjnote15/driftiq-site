name: Build Solar Empire

on:
  push:
    branches:
      - claude/solar-empire-idle-game-akn240
    paths:
      - "SolarEmpire/**"
      - ".github/workflows/solar-empire-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for iPhone simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project SolarEmpire/SolarEmpire.xcodeproj \
            -scheme SolarEmpire \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -y SolarEmpire-Simulator.zip SolarEmpire.app

      - name: Upload app for browser testing (appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SolarEmpire-Simulator
          path: build/Build/Products/Debug-iphonesimulator/SolarEmpire-Simulator.zip
          retention-days: 30

      # Same file on a stable, login-free URL:
      # https://github.com/jjnote15/driftiq-site/releases/download/simulator-latest/SolarEmpire-Simulator.zip
      - name: Publish to "simulator-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view simulator-latest >/dev/null 2>&1 || \
            gh release create simulator-latest \
              --title "Solar Empire – spelbart simulatorbygge" \
              --notes "Senaste gröna bygget. Ladda ned SolarEmpire-Simulator.zip och ladda upp den på appetize.io för att spela i webbläsaren." \
              --prerelease \
              --target "$GITHUB_SHA"
          gh release upload simulator-latest \
            build/Build/Products/Debug-iphonesimulator/SolarEmpire-Simulator.zip --clobber
